<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Hover Animation</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f5ff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .card {
      position: relative;
      width: 560px;
      height: 600px;
      border: 2px dashed #a78bfa;
      border-radius: 24px;
      overflow: hidden;
      cursor: pointer;
    }

    .card img {
      position: absolute;
      width: 480px;
      height: 520px;
      object-fit: cover;
      border-radius: 40px;

      /* Default: lower-left */
      bottom: -20px;
      left: -20px;

      transition:
        width 0.5s cubic-bezier(0.4, 0, 0.2, 1),
        height 0.5s cubic-bezier(0.4, 0, 0.2, 1),
        bottom 0.5s cubic-bezier(0.4, 0, 0.2, 1),
        left 0.5s cubic-bezier(0.4, 0, 0.2, 1),
        right 0.5s cubic-bezier(0.4, 0, 0.2, 1),
        top 0.5s cubic-bezier(0.4, 0, 0.2, 1),
        border-radius 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card:hover img {
      /* Hover: upper-right, smaller */
      width: 420px;
      height: 456px;
      bottom: unset;
      left: unset;
      top: 20px;
      right: 20px;
      border-radius: 28px;
    }
  </style>
</head>
<body>

  <div class="card">
    <img
      src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=960&q=80"
      alt="Portrait"
    />
  </div>

</body>
</html>
